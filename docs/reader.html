<!doctype html>
<html lang="it" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5efe4"><meta name="description" content="Lettura del Corano in arabo, con morfologia, note e segnalibri locali.">
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/app.css?v=5">
<title>Corano · Sala di lettura</title>
</head>
<body>
<header class="topbar"><a class="brand" href="./"><span class="brand-mark" aria-hidden="true">﷽</span><span><b>Sacred Texts</b><small>QURAN</small></span></a><nav aria-label="Navigazione"><a href="./#search">Ricerca</a><a href="./#surahs">Le sure</a><a class="top-enter" href="./">Biblioteca</a></nav></header>
<main class="reader-shell">
<section class="reader-head reveal seen"><div><a class="text-link" href="./">← Biblioteca</a><span id="suraNumber" class="eyebrow" style="display:block;margin-top:24px"></span><h1 id="suraTitle">Caricamento…</h1><p id="suraMeta"></p></div><div class="reader-actions"><button id="fontDown" class="ghost" type="button" aria-label="Riduci testo">A−</button><button id="fontUp" class="ghost" type="button" aria-label="Aumenta testo">A+</button><button id="theme" class="ghost" type="button">Tema</button></div></section>
<div class="reader-progress" aria-hidden="true"><span id="progressBar"></span></div>
<div class="reader-layout">
<aside class="side-nav" aria-label="Controlli di lettura"><label for="suraSelect">Sura</label><select id="suraSelect"></select><label for="verseJump">Vai al versetto</label><input id="verseJump" type="number" min="1" inputmode="numeric" placeholder="es. 255"><button id="jumpBtn" class="primary" type="button">Vai</button><hr><button id="prevSura" class="ghost" type="button">← Sura precedente</button><button id="nextSura" class="ghost" type="button">Sura successiva →</button><hr><button id="bookmarkCurrent" class="ghost" type="button">Segnalibro</button><button id="showNotes" class="ghost" type="button">Note e segnalibri</button></aside>
<section><div id="verses" class="verses" aria-live="polite"></div></section>
</div></main>
<dialog id="morphDialog" class="role-dialog"><form method="dialog"><button class="close" aria-label="Chiudi">×</button><span class="eyebrow">ANALISI PAROLA</span><h2 id="morphTitle">Morfologia</h2><div id="morphBody"></div><button class="primary">Chiudi</button></form></dialog>
<dialog id="noteDialog" class="role-dialog"><form id="noteForm"><button type="button" class="close" id="noteClose" aria-label="Chiudi">×</button><span class="eyebrow">BIBLIOTECA PERSONALE</span><h2>Nota locale</h2><p id="noteRef"></p><textarea id="noteText" rows="8" placeholder="La nota resta sul tuo dispositivo."></textarea><div class="dialog-actions"><button type="button" id="deleteNote" class="ghost">Elimina</button><button class="primary">Salva</button></div></form></dialog>
<dialog id="localDialog" class="role-dialog"><form method="dialog"><button class="close" aria-label="Chiudi">×</button><span class="eyebrow">BIBLIOTECA PERSONALE</span><h2>Note e segnalibri</h2><div id="localList"></div><button class="primary">Chiudi</button></form></dialog>
<script src="assets/reader.js?v=5" defer></script>
</body></html>
