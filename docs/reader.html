<!doctype html>
<html lang="it" dir="ltr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0a08"><meta name="description" content="Sala di lettura del Corano con morfologia, note e segnalibri locali."><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/app.css?v=4"><title>Corano · Sala di lettura</title></head>
<body class="reader-page">

<div class="reader-layout"><aside class="side-nav" aria-label="Controlli di lettura"><div class="side-section"><label for="suraSelect">Sura</label><select id="suraSelect"></select></div><div class="side-section"><label for="verseJump">Vai al versetto</label><div class="jump"><input id="verseJump" type="number" min="1" inputmode="numeric" placeholder="255"><button id="jumpBtn" class="primary" type="button">Vai</button></div></div><div class="side-links"><button id="prevSura" class="ghost" type="button">← Precedente</button><button id="nextSura" class="ghost" type="button">Successiva →</button></div><div class="side-links"><button id="bookmarkCurrent" class="ghost" type="button">Segnalibro</button><button id="showNotes" class="ghost" type="button">Note locali</button></div><div class="reading-note"><span>◈</span><p>Seleziona una parola nel testo per vedere l'annotazione morfologica disponibile.</p></div></aside><section><div id="verses" class="verses" aria-live="polite"></div><div class="reader-end"><a class="ghost" href="./">Torna alla biblioteca</a></div></section></div></main>
