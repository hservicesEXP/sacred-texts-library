<!DOCTYPE html>

<head>
<meta charset="UTF-8" />
<title>الماعون</title>
<style>
@page { margin: 2cm; }
body {
    font-family: 'KFGQPC Uthmanic HAFS', 'Noto Naskh Arabic', serif;
    direction: rtl;
    unicode-bidi: isolate;
    font-size: 16pt;
    line-height: 1.9;
    max-width: 46em;
    margin: 0 auto;
    padding: 1.5em;
}
h1 { text-align: center; font-size: 1.4em; margin-bottom: 1.2em; }
p.verse { margin: 0 0 0.6em 0; }
span.vnum {
    font-family: sans-serif;
    font-size: 0.6em;
    color: #888;
    unicode-bidi: isolate;
    margin: 0 0.4em;
}
</style>
</head>
<body>
<h1>الماعون</h1>
<h2 class="chapter">107</h2>
<p class="verse"><span class="vnum">1</span>أَرَءَيْتَ ٱلَّذِى يُكَذِّبُ بِٱلدِّينِ</p>
<p class="verse"><span class="vnum">2</span>فَذَٰلِكَ ٱلَّذِى يَدُعُّ ٱلْيَتِيمَ</p>
<p class="verse"><span class="vnum">3</span>وَلَا يَحُضُّ عَلَىٰ طَعَامِ ٱلْمِسْكِينِ</p>
<p class="verse"><span class="vnum">4</span>فَوَيْلٌ لِّلْمُصَلِّينَ</p>
<p class="verse"><span class="vnum">5</span>ٱلَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ</p>
<p class="verse"><span class="vnum">6</span>ٱلَّذِينَ هُمْ يُرَآءُونَ</p>
<p class="verse"><span class="vnum">7</span>وَيَمْنَعُونَ ٱلْمَاعُونَ</p>
</body></html>
