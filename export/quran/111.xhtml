<meta charset="UTF-8" />
<title>المسد</title>
<style>
@page { margin: 2cm; }
body {
    font-family: 'KFGQPC Uthmanic HAFS', 'Noto Naskh Arabic', serif;
    direction: rtl;
    unicode-bidi: isolate;
    font-size: 16pt;
    line-height: 1.9;
    max-width: 46em;
    margin: 0 auto;
    padding: 1.5em;
}
h1 { text-align: center; font-size: 1.4em; margin-bottom: 1.2em; }
p.verse { margin: 0 0 0.6em 0; }
span.vnum {
    font-family: sans-serif;
    font-size: 0.6em;

    margin: 0 0.4em;
}

<body>
<h1>المسد</h1>
<h2 class="chapter">111</h2>
<p class="verse"><span class="vnum">1</span>تَبَّتْ يَدَآ أَبِى لَهَبٍ وَتَبَّ</p>
<p class="verse"><span class="vnum">2</span>مَآ أَغْنَىٰ عَنْهُ مَالُهُۥ وَمَا كَسَبَ</p>
<p class="verse"><span class="vnum">3</span>سَيَصْلَىٰ نَارًا ذَاتَ لَهَبٍ</p>
<p class="verse"><span class="vnum">4</span>وَٱمْرَأَتُهُۥ حَمَّالَةَ ٱلْحَطَبِ</p>
<p class="verse"><span class="vnum">5</span>فِى جِيدِهَا حَبْلٌ مِّن مَّسَدٍۭ</p>
</body></html>
