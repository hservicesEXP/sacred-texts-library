<meta charset="UTF-8" />
<title>الشرح</title>
<style>
@page { margin: 2cm; }
body {
    font-family: 'KFGQPC Uthmanic HAFS', 'Noto Naskh Arabic', serif;
    direction: rtl;
    unicode-bidi: isolate;
    font-size: 16pt;
    line-height: 1.9;
    max-width: 46em;
    margin: 0 auto;
    padding: 1.5em;
}
h1 { text-align: center; font-size: 1.4em; margin-bottom: 1.2em; }
p.verse { margin: 0 0 0.6em 0; }
span.vnum {
    font-family: sans-serif;
    font-size: 0.6em;
    color: #888;
    unicode-bidi: isolate;
    margin: 0 0.4em;
}
</style>

<body>
<h1>الشرح</h1>
<h2 class="chapter">94</h2>
<p class="verse"><span class="vnum">1</span>أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ</p>
<p class="verse"><span class="vnum">2</span>وَوَضَعْنَا عَنكَ وِزْرَكَ</p>
<p class="verse"><span class="vnum">3</span>ٱلَّذِىٓ أَنقَضَ ظَهْرَكَ</p>
<p class="verse"><span class="vnum">4</span>وَرَفَعْنَا لَكَ ذِكْرَكَ</p>
<p class="verse"><span class="vnum">5</span>فَإِنَّ مَعَ ٱلْعُسْرِ يُسْرًا</p>
<p class="verse"><span class="vnum">6</span>إِنَّ مَعَ ٱلْعُسْرِ يُسْرًا</p>
<p class="verse"><span class="vnum">7</span>فَإِذَا فَرَغْتَ فَٱنصَبْ</p>
<p class="verse"><span class="vnum">8</span>وَإِلَىٰ رَبِّكَ فَٱرْغَب</p>
</body></html>
