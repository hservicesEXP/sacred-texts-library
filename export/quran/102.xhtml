<title>التكاثر</title>
<style>

body {
    font-family: 'KFGQPC Uthmanic HAFS', 'Noto Naskh Arabic', serif;
    direction: rtl;
    unicode-bidi: isolate;
    font-size: 16pt;
    line-height: 1.9;

    padding: 1.5em;

<body>
<h1>التكاثر</h1>
<h2 class="chapter">102</h2>
<p class="verse"><span class="vnum">1</span>أَلْهَىٰكُمُ ٱلتَّكَاثُرُ</p>
<p class="verse"><span class="vnum">2</span>حَتَّىٰ زُرْتُمُ ٱلْمَقَابِرَ</p>
<p class="verse"><span class="vnum">3</span>كَلَّا سَوْفَ تَعْلَمُونَ</p>
<p class="verse"><span class="vnum">4</span>ثُمَّ كَلَّا سَوْفَ تَعْلَمُونَ</p>
<p class="verse"><span class="vnum">5</span>كَلَّا لَوْ تَعْلَمُونَ عِلْمَ ٱلْيَقِينِ</p>
<p class="verse"><span class="vnum">6</span>لَتَرَوُنَّ ٱلْجَحِيمَ</p>
<p class="verse"><span class="vnum">7</span>ثُمَّ لَتَرَوُنَّهَا عَيْنَ ٱلْيَقِينِ</p>
<p class="verse"><span class="vnum">8</span>ثُمَّ لَتُسْـَٔلُنَّ يَوْمَئِذٍ عَنِ ٱلنَّعِيمِ</p>
</body></html>
